[pytest]
asyncio_mode = auto
testpaths = backend/tests
filterwarnings =
    # Issue 040: asyncio.Future() in CallSupervisor.__init__ emits a
    # deprecation warning when there is no running event loop (sync test
    # bodies). The warning is a Python-3.10+ soft-deprecation of
    # asyncio.get_event_loop(); it does NOT indicate a bug — production
    # callers always run inside an async handler so a loop is present.
    ignore::DeprecationWarning:backend.call_supervisor
